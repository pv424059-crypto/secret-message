<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Message 💖</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#a18cd1,#fbc2eb);
background-size:400% 400%;
animation:bg 10s ease infinite;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:90%;
max-width:380px;
background:rgba(255,255,255,0.18);
backdrop-filter:blur(18px);
padding:30px;
border-radius:30px;
text-align:center;
box-shadow:0 25px 60px rgba(0,0,0,0.25);
border:1px solid rgba(255,255,255,.3);
z-index:10;
}

.profile{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:5px solid white;
box-shadow:0 0 25px rgba(255,255,255,.6);
margin-bottom:15px;
}

h1{
color:white;
margin-bottom:8px;
}

.sub{
color:white;
font-size:14px;
margin-bottom:20px;
}

.btn{
padding:14px 28px;
border:none;
border-radius:40px;
background:white;
color:#ff4d79;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.btn:hover{
transform:scale(1.08);
}

#msg{
display:none;
margin-top:20px;
padding:20px;
border-radius:20px;
background:rgba(255,255,255,.2);
color:white;
font-size:18px;
line-height:1.7;
animation:fade 1s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.heart{
position:absolute;
bottom:-50px;
font-size:28px;
animation:float 8s linear infinite;
opacity:.8;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

</style>
</head>
<body>

<audio autoplay loop controls style="position:absolute;top:10px;">
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="heart" style="left:10%;animation-delay:0s;">💖</div>
<div class="heart" style="left:25%;animation-delay:2s;">✨</div>
<div class="heart" style="left:45%;animation-delay:4s;">💖</div>
<div class="heart" style="left:65%;animation-delay:1s;">💫</div>
<div class="heart" style="left:85%;animation-delay:3s;">💖</div>

<div class="card">

<img src="WhatsApp Image 2026-05-09 at 10.41.23 AM(1).jpeg" class="profile">

<h1>Hey 👋</h1>

<p class="sub">
Ek chhota sa secret message tumhare liye ✨
</p>

<button class="btn" onclick="showMsg()">
Open Message 💌
</button>

<div id="msg">

🎉 Congratulations!

<br><br>

Tumne successfully secret message unlock kar liya. 🔓

<br><br>

Ab reward ke roop me ek smile deni padegi. 😁

<br><br>

Nahi di to system automatically tumhe

<b>"Cute Person"</b>

declare kar dega. 😂

</div>

</div>

<script>

function showMsg(){
document.getElementById("msg").style.display="block";
}

</script>

</body>
</html>
